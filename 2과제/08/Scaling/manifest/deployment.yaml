apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqs-worker
  namespace: skills-sqs
  labels:
    app: sqs-worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sqs-worker
  template:
    metadata:
      labels:
        app: sqs-worker
    spec:
      serviceAccountName: sqs-worker-sa
      containers:
      - name: worker
        image: <IMAGE_URL>
        env:
        - name: SQS_QUEUE_URL
          value: "<SQS_URL>"
        - name: AWS_REGION
          value: "us-west-2"
        - name: PROCESSING_SECONDS
          value: "5"

      nodeSelector:
        karpenter.sh/nodepool: skills-sqs-nodepool
        skills-nodepool: event-worker