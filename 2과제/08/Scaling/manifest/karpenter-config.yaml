apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: skills-sqs-nodeclass
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@v1.30
    
  role: KarpenterNodeRole-skills-sqs-cluster
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "skills-sqs-cluster"
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/skills-sqs-cluster: "owned"
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: skills-sqs-nodepool
spec:
  template:
    metadata:
      labels:
        skills-nodepool: event-worker
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: skills-sqs-nodeclass
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s