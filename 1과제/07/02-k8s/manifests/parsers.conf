[PARSER]
    Name        cri
    Format      regex
    Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   Off

# book 바이너리 실제 access 로그 포맷 (Go 표준 log 패키지 타임스탬프 프리픽스 + remote_addr에 포트 포함):
# 2026/07/16 01:09:12 access method=GET path=/health status=200 duration=46.401µs remote_addr=10.97.12.59:48816 user_agent="kube-probe/1.35"
[PARSER]
    Name        book_access
    Format      regex
    Regex       ^\S+ \S+ access method=(?<method>\S+) path=(?<path>\S+) status=(?<status_code>\d+) duration=(?<duration>\S+) remote_addr=(?<client_ip>[0-9.]+):\d+ user_agent="(?<user_agent>[^"]*)"$
    Types       status_code:integer
